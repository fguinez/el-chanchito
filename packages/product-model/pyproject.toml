[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chanchito-product-model"
version = "0.1.0"
description = "Per-kind product payload models and ingest envelopes shared by all scrapers."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools]
packages = ["product_model"]
