services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
      # Internal-only control endpoint on the scraper service (see below).
      SCRAPER_CONTROL_URL: ${SCRAPER_CONTROL_URL:-http://scrapers:8080}
      # Dashboard login. Without DASHBOARD_PASSWORD the app fails closed in
      # production and serves nothing (see USAGE.md > Deployment).
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_SESSION_MAX_AGE: ${DASHBOARD_SESSION_MAX_AGE:-}
      # Set to 1 only when a reverse proxy in front rewrites X-Forwarded-*
      # (see USAGE.md > Behind a reverse proxy); unset means they are ignored.
      DASHBOARD_TRUST_PROXY: ${DASHBOARD_TRUST_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy

  scrapers:
    build:
      context: .
      dockerfile: apps/scrapers/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@postgres:5432/${POSTGRES_DB:-finance}
      BANCHILE_RUT: ${BANCHILE_RUT:-}
      BANCHILE_PASSWORD: ${BANCHILE_PASSWORD:-}
      FINTUAL_EMAIL: ${FINTUAL_EMAIL:-}
      FINTUAL_PASSWORD: ${FINTUAL_PASSWORD:-}
      FINTUAL_TOKEN: ${FINTUAL_TOKEN:-}
      BUDA_API_KEY: ${BUDA_API_KEY:-}
      BUDA_API_SECRET: ${BUDA_API_SECRET:-}
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-}
      EMAIL_IMAP_USER: ${EMAIL_IMAP_USER:-}
      EMAIL_IMAP_PASSWORD: ${EMAIL_IMAP_PASSWORD:-}
      # Cached Fintual web session (see `make fintual-login`); persisted in the
      # scraper_state volume so 2FA isn't re-triggered on every container start.
      FINTUAL_SESSION_FILE: ${FINTUAL_SESSION_FILE:-/data/fintual_session.json}
      # On-demand refresh: the web app POSTs to this port to trigger a scrape.
      SCRAPER_CONTROL_PORT: ${SCRAPER_CONTROL_PORT:-8080}
    # `expose` (not `ports`) keeps the control endpoint on the private compose
    # network only — it's an unauthenticated trigger, never publish it (see #23).
    expose:
      - "8080"
    volumes:
      - scraper_state:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  scraper_state:
