name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web (typecheck, lint, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Reads the pnpm version from the root package.json `packageManager`.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make typecheck
      - run: make lint
      - run: make test-ts

  python:
    name: Python (pytest, DB tests included)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway server for the DB tests; they create and drop their own
    # chanchito_test_* databases on it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U finance"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://finance:finance@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/scrapers/requirements*.txt
            packages/product-model/pyproject.toml
      # No Playwright browser download: no test launches one.
      - run: make install-py
      - run: make test-py

  # The scraper code must run natively on macOS and Windows too (the shell
  # tooling on Windows is WSL2, so no make here). No Postgres service: the DB
  # tests are deselected here, and the ubuntu job runs them.
  python-cross-platform:
    name: Python (pytest, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF endings so fixtures and generated files match the repo bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/scrapers/requirements*.txt
            packages/product-model/pyproject.toml
      # pip resolves `-e ../../packages/product-model` from its working dir.
      - name: Install
        working-directory: apps/scrapers
        run: python -m pip install -r requirements-dev.txt
      - name: Scraper tests
        working-directory: apps/scrapers
        run: python -m pytest tests/ -q -m "not db"
      - name: Product model tests
        working-directory: packages/product-model
        run: python -m pytest tests/ -q
      - name: Secret store tests
        run: python -m pytest scripts/tests/ -q

  # Raspberry Pi path: both images must build on native linux/arm64.
  docker-arm64:
    name: Docker images (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -f apps/scrapers/Dockerfile -t chanchito-scrapers:ci .
      - run: docker build -f apps/web/Dockerfile -t chanchito-web:ci .
